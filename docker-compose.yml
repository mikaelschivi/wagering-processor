name: wagering

services:
  postgres:
    image: postgres:16.4
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:-postgres_dev}
      POSTGRES_DB: wagering
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.0.3   # last tag line without the auth-token requirement
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"\\(available\\|running\\)\"'"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
