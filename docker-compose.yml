name: wagering

x-app: &app
  image: wagering-app:local
  pull_policy: never
  environment: &app-environment
    PORT: "3000"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: wagering
    DB_APP_USER: wagering_app
    DB_APP_PASSWORD: ${DB_APP_PASSWORD:-wagering_app_dev}
    DB_OWNER_USER: wagering_owner
    DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-wagering_owner_dev}
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_REGION: ${AWS_REGION:-us-east-1}
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test

x-instance: &instance
  <<: *app
  depends_on:
    migrate:
      condition: service_completed_successfully
    create-queues:
      condition: service_completed_successfully
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 5s

services:
  postgres:
    image: postgres:16.4
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:-postgres_dev}
      POSTGRES_DB: wagering
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.0.3   # last tag line without the auth-token requirement
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"\\(available\\|running\\)\"'"]
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    build: .
    command: ["bun", "scripts/migrate.ts", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  create-queues:
    <<: *app
    command: ["bun", "scripts/create-queues.ts"]
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

  app-1:
    <<: *instance
    ports:
      - "3001:3000"

  app-2:
    <<: *instance
    ports:
      - "3002:3000"

  app-3:
    <<: *instance
    ports:
      - "3003:3000"

volumes:
  pgdata:
